  <text x="1470" y="145" class="section">Общие зависимости и источники</text>
  <text x="1470" y="168" class="small muted">Один ID = одна проверка; consumers перечислены в Markdown.</text>

  <rect x="1464" y="184" width="344" height="574" rx="6" class="card dependency"/>
  <text x="1478" y="208" class="card-title">D01, D03–D10 · Storage</text>
  <text x="1478" y="235" class="body"><tspan class="id">D01</tspan> BondsProvider</text>
  <rect x="1474" y="246" width="206" height="25" rx="5" class="reviewed-pill"/>
  <text x="1482" y="263" class="small reviewed-text">SearchAsync ✓ · R02/R03 исправлены</text>
  <text x="1478" y="315" class="body"><tspan class="id">D03</tspan> PortfolioMoneyMarketFundsProvider</text>
  <text x="1482" y="341" class="small reviewed-text"></text>
  <text x="1478" y="355" class="body"></text>
  <text x="1478" y="395" class="body"><tspan class="id">D04</tspan> PortfolioTradesProvider</text>
  <text x="1478" y="435" class="body"><tspan class="id">D05</tspan> PortfolioCashFlowsProvider</text>
  <text x="1478" y="475" class="body"><tspan class="id">D06</tspan> PortfolioValuationsProvider</text>
  <text x="1478" y="515" class="body"><tspan class="id">D07</tspan> PortfolioPositionsProvider</text>
  <text x="1478" y="555" class="body"><tspan class="id">D08</tspan> PortfolioCouponProvider</text>
  <text x="1478" y="595" class="body"><tspan class="id">D09</tspan> HistoryProvider</text>
  <text x="1478" y="635" class="body"><tspan class="id">D10</tspan> DailyVolumeStatisticsStore</text>
  <text x="1478" y="718" class="small muted">Interfaces in Core · implementations in Storage</text>

  <rect x="1818" y="184" width="344" height="574" rx="6" class="card dependency"/>
  <text x="1832" y="208" class="card-title">D11–D21 · Storage / infrastructure</text>
  <text x="1832" y="235" class="body"><tspan class="id">D11</tspan> InvestmentStrategySettingsStore</text>
  <text x="1832" y="275" class="body"><tspan class="id">D12</tspan> RatingsProvider</text>
  <text x="1832" y="315" class="body"><tspan class="id">D13</tspan> CashFlowProvider</text>
  <text x="1832" y="355" class="body"><tspan class="id">D14</tspan> PositionRecommendationStore</text>
  <text x="1832" y="395" class="body"><tspan class="id">D15</tspan> ClosedPositionSessionsProvider</text>
  <text x="1832" y="435" class="body"><tspan class="id">D16</tspan> InitializationStateStore</text>
  <text x="1832" y="475" class="body"><tspan class="id">D17</tspan> BondBenchmarkHistoryProvider</text>
  <text x="1832" y="515" class="body"><tspan class="id">D18</tspan> MoexIndexHistoryStore</text>
  <text x="1832" y="555" class="body"><tspan class="id">D19</tspan> direct FX query via DbContext</text>
  <text x="1832" y="595" class="body"><tspan class="id">D20</tspan> Hangfire client / JobStorage</text>
  <text x="1832" y="635" class="body"><tspan class="id">D21</tspan> ClosedPositionSessionSourceProvider</text>
  <text x="1832" y="697" class="small muted">D16 is shared with API and background jobs</text>

  <rect x="1464" y="770" width="344" height="300" rx="6" class="card calc"/>
  <text x="1478" y="794" class="card-title">K02–K09 · Core rules</text>
  <text x="1478" y="852" class="body"><tspan class="id">K02</tspan> Open-position calculators</text>
  <text x="1478" y="882" class="body"><tspan class="id">K03</tspan> Trade / lot validation</text>
  <text x="1478" y="912" class="body"><tspan class="id">K04</tspan> Position recommendations</text>
  <text x="1478" y="942" class="body"><tspan class="id">K05</tspan> TWR: Calculate</text>
  <text x="1478" y="972" class="body"><tspan class="id">K06</tspan> Benchmark series</text>
  <text x="1478" y="1002" class="body"><tspan class="id">K07</tspan> Bond YTM / cash flows</text>
  <text x="1478" y="1032" class="body"><tspan class="id">K08</tspan> Closed-position calculators</text>
  <text x="1478" y="1054" class="small muted"><tspan class="id">K09</tspan> Shared rules: time, coupon type</text>

  <rect x="1818" y="770" width="344" height="300" rx="6" class="card dependency"/>
  <text x="1832" y="794" class="card-title">H01–H03 · Клиенты и транспорт</text>
  <text x="1832" y="824" class="body"><tspan class="id">H01</tspan> MoexHttpClient</text>
  <text x="1832" y="852" class="small muted">S07, S10–S12 and MOEX jobs</text>
  <text x="1832" y="890" class="body"><tspan class="id">H02</tspan> CBondClient / CbrHttpClient</text>
  <text x="1832" y="918" class="small muted">Used by background jobs</text>
  <text x="1832" y="964" class="body"><tspan class="id">H03</tspan> ISS mapping / date serialization</text>
  <text x="1832" y="988" class="small muted">Method checklist is in application-review-map.md</text>

  <rect x="1464" y="1082" width="698" height="256" rx="6" class="card job"/>
  <text x="1478" y="1106" class="card-title">J01–J04 · Фоновые производители состояния и данных</text>
  <text x="1478" y="1134" class="body"><tspan class="id">J01</tspan> Initial bootstrap + recurring scheduler</text>
  <text x="1478" y="1160" class="body"><tspan class="id">J02</tspan> 9 MOEX / CBond / CBR synchronization jobs</text>
  <text x="1478" y="1186" class="body"><tspan class="id">J03</tspan> PositionRecommendationJob → K04 → D14 → C07</text>
  <text x="1478" y="1212" class="body"><tspan class="id">J04</tspan> ClosedPositionSessionsJob → D21 → K08 → D15 → C04</text>
  <text x="1478" y="1250" class="small muted">Проверять producer один раз; на HTTP-ветке проверять только чтение/контракт.</text>
  <text x="1478" y="1276" class="small muted">Фоновые записи важны, потому что контроллеры читают их снимки и справочники.</text>

  <rect x="1464" y="1350" width="698" height="112" rx="6" class="card"/>
  <text x="1478" y="1374" class="card-title">G01 · Общий HTTP-контур</text>
  <text x="1478" y="1400" class="body">FluentValidationActionFilter · request validators · ApiExceptionHandler · DI registrations</text>
  <text x="1478" y="1424" class="body">Выполнять одно ревью на все C01–C08; проверять route-specific binding на ветке контроллера.</text>
  <text x="1478" y="1448" class="small muted">Подробный список методов и перекрёстных ссылок находится в Markdown-файле.</text>
</svg>
